name: Android
on:
  workflow_dispatch:
    inputs:
      versio:
        description: "Versió de la release (buit = només compilar)"
        required: false
        default: ""
      demo:
        description: "Marcar com a demo (prerelease)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compila
        env:
          VERSIO: ${{ inputs.versio }}
          RUN: ${{ github.run_number }}
        run: |
          export BUILD_ID="${VERSIO:-prova}-${RUN}-${GITHUB_SHA:0:7}"
          gradle :music:assembleRelease --no-daemon
      - name: Contingut dels APK (diagnòstic de mida)
        run: |
          for A in music/build/outputs/apk/release/music-release.apk; do
            echo "== $A $(stat -c %s "$A") bytes"
            unzip -l "$A" | sort -k1 -n -r | head -12
            rm -rf /tmp/x && mkdir -p /tmp/x && unzip -q -o "$A" -d /tmp/x
            for F in /tmp/x/classes*.dex; do echo "$F $(stat -c %s "$F") bytes; referències a classes de consoles: $(strings "$F" | grep -c 'cat/gbdsmixxx/\(Cpu6502\|GbCpu\|NesApu\|SnesSpc\|SnesRom\|RomsConsoles\)')"; done
          done
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.versio == '' }}          # amb versió, l'APK ja va a la release
        continue-on-error: true
        with:
          name: apks
          path: |
            music/build/outputs/apk/release/*.apk
      - name: Release
        if: ${{ inputs.versio != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.versio }}
          DEMO: ${{ inputs.demo }}
        run: |
          cp music/build/outputs/apk/release/music-release.apk "ostixxx-music-$V.apk"
          if [ "$DEMO" = "true" ]; then T="Demo $V"; P="--prerelease"; else T="$V"; P=""; fi
          gh release delete "v$V" --cleanup-tag --yes || true
          gh release create "v$V" "ostixxx-music-$V.apk" --title "$T" $P --notes-file RELEASE_NOTES.md
          # Amaga les demos antigues (passen a esborrany; es poden recuperar des de GitHub)
          if [ "$DEMO" != "true" ]; then
            for T in $(gh release list --limit 100 --json tagName,name,isPrerelease --jq '.[] | select(.isPrerelease and (.name | startswith("Demo "))) | .tagName'); do gh release edit "$T" --draft || true; done
          fi
